<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" fill="none">
  <!-- Background Canvas -->
  <rect width="800" height="600" rx="16" fill="#F8FAFC"/>
  <circle cx="680" cy="140" r="75" fill="#EFF6FF" opacity="0.8"/>
  <circle cx="110" cy="450" r="85" fill="#E2E8F0" opacity="0.6"/>

  <!-- Browser Window Mockup -->
  <g transform="translate(130, 95)">
    <!-- Browser Chrome -->
    <rect width="540" height="350" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" filter="drop-shadow(0 20px 25px rgba(15,23,42,0.1))"/>
    
    <!-- Top URL Bar -->
    <rect width="540" height="46" rx="12" fill="#F1F5F9"/>
    <rect y="36" width="540" height="10" fill="#F1F5F9"/>
    <circle cx="24" cy="23" r="5" fill="#EF4444"/>
    <circle cx="42" cy="23" r="5" fill="#F59E0B"/>
    <circle cx="60" cy="23" r="5" fill="#10B981"/>
    
    <!-- URL Input Pill -->
    <rect x="86" y="11" width="340" height="24" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="102" cy="23" r="4" fill="#94A3B8"/>
    <rect x="114" y="20" width="140" height="6" rx="2" fill="#64748B"/>
    
    <!-- Viewport Content Area -->
    <!-- Nav Mock -->
    <rect x="24" y="66" width="100" height="12" rx="3" fill="#0F172A"/>
    <rect x="360" y="68" width="40" height="8" rx="2" fill="#94A3B8"/>
    <rect x="415" y="68" width="40" height="8" rx="2" fill="#94A3B8"/>
    <rect x="470" y="64" width="45" height="16" rx="4" fill="#2563EB"/>

    <!-- Hero Mockup in Browser -->
    <rect x="24" y="105" width="260" height="18" rx="4" fill="#0F172A"/>
    <rect x="24" y="132" width="210" height="8" rx="2" fill="#64748B"/>
    <rect x="24" y="147" width="180" height="8" rx="2" fill="#94A3B8"/>
    
    <!-- Action buttons -->
    <rect x="24" y="172" width="80" height="26" rx="4" fill="#2563EB"/>
    <rect x="115" y="172" width="70" height="26" rx="4" fill="#F1F5F9" stroke="#E2E8F0"/>

    <!-- Component Cards inside Viewport -->
    <rect x="24" y="222" width="150" height="95" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <rect x="36" y="234" width="28" height="28" rx="6" fill="#EFF6FF"/>
    <rect x="74" y="238" width="70" height="8" rx="2" fill="#0F172A"/>
    <rect x="74" y="252" width="50" height="6" rx="2" fill="#94A3B8"/>
    <rect x="36" y="278" width="120" height="6" rx="2" fill="#E2E8F0"/>
    <rect x="36" y="292" width="90" height="6" rx="2" fill="#E2E8F0"/>

    <rect x="190" y="222" width="150" height="95" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <rect x="202" y="234" width="28" height="28" rx="6" fill="#EFF6FF"/>
    <rect x="240" y="238" width="70" height="8" rx="2" fill="#0F172A"/>
    <rect x="240" y="252" width="50" height="6" rx="2" fill="#94A3B8"/>
    <rect x="202" y="278" width="120" height="6" rx="2" fill="#E2E8F0"/>
    <rect x="202" y="292" width="90" height="6" rx="2" fill="#E2E8F0"/>

    <!-- Right Media Box -->
    <rect x="360" y="105" width="155" height="212" rx="8" fill="#EFF6FF" stroke="#DBEAFE"/>
    <rect x="385" y="135" width="105" height="70" rx="6" fill="#2563EB" opacity="0.85"/>
    <rect x="385" y="220" width="80" height="10" rx="3" fill="#1E40AF"/>
    <rect x="385" y="240" width="100" height="6" rx="2" fill="#93C5FD"/>
    <rect x="385" y="254" width="60" height="6" rx="2" fill="#93C5FD"/>
  </g>

  <!-- Mobile Viewport Overlap -->
  <g transform="translate(480, 310)">
    <rect width="180" height="210" rx="16" fill="#0F172A" stroke="#334155" stroke-width="3" filter="drop-shadow(0 20px 25px rgba(0,0,0,0.2))"/>
    <rect x="65" y="8" width="50" height="8" rx="4" fill="#334155"/>
    <!-- Screen -->
    <rect x="12" y="24" width="156" height="170" rx="8" fill="#FFFFFF"/>
    <rect x="24" y="38" width="70" height="10" rx="3" fill="#0F172A"/>
    <rect x="24" y="55" width="120" height="6" rx="2" fill="#94A3B8"/>
    <rect x="24" y="67" width="90" height="6" rx="2" fill="#CBD5E1"/>
    <rect x="24" y="85" width="132" height="45" rx="6" fill="#EFF6FF"/>
    <rect x="36" y="98" width="40" height="8" rx="2" fill="#2563EB"/>
    <rect x="36" y="112" width="70" height="5" rx="2" fill="#64748B"/>
    <rect x="24" y="142" width="132" height="24" rx="4" fill="#2563EB"/>
  </g>
</svg>
