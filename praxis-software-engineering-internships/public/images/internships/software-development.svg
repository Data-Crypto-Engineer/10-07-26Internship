<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" fill="none">
  <!-- Background Canvas -->
  <rect width="800" height="600" rx="16" fill="#F8FAFC"/>
  <circle cx="680" cy="120" r="80" fill="#E2E8F0" opacity="0.6"/>
  <circle cx="120" cy="480" r="90" fill="#EFF6FF" opacity="0.7"/>

  <!-- Code Editor Window -->
  <g transform="translate(140, 100)">
    <!-- Window Frame -->
    <rect width="520" height="340" rx="12" fill="#0F172A" filter="drop-shadow(0 20px 25px rgba(15,23,42,0.15))"/>
    <!-- Window Header -->
    <rect width="520" height="42" rx="12" fill="#1E293B"/>
    <rect y="32" width="520" height="10" fill="#1E293B"/>
    <!-- Window Controls -->
    <circle cx="24" cy="21" r="5" fill="#EF4444"/>
    <circle cx="42" cy="21" r="5" fill="#F59E0B"/>
    <circle cx="60" cy="21" r="5" fill="#10B981"/>
    <!-- File Tab -->
    <rect x="90" y="8" width="120" height="26" rx="4" fill="#0F172A"/>
    <text x="105" y="25" fill="#94A3B8" font-family="monospace" font-size="11" font-weight="600">engine.ts</text>

    <!-- Sidebar File Tree -->
    <rect x="0" y="42" width="110" height="298" fill="#111827"/>
    <rect x="16" y="60" width="60" height="6" rx="3" fill="#475569"/>
    <rect x="24" y="78" width="50" height="5" rx="2" fill="#334155"/>
    <rect x="24" y="94" width="65" height="5" rx="2" fill="#2563EB"/>
    <rect x="24" y="110" width="45" height="5" rx="2" fill="#334155"/>
    <rect x="16" y="132" width="70" height="6" rx="3" fill="#475569"/>
    <rect x="24" y="150" width="55" height="5" rx="2" fill="#334155"/>

    <!-- Code Editor Content -->
    <!-- Line Numbers -->
    <g fill="#475569" font-family="monospace" font-size="11">
      <text x="130" y="76">01</text>
      <text x="130" y="104">02</text>
      <text x="130" y="132">03</text>
      <text x="130" y="160">04</text>
      <text x="130" y="188">05</text>
      <text x="130" y="216">06</text>
      <text x="130" y="244">07</text>
      <text x="130" y="272">08</text>
      <text x="130" y="300">09</text>
    </g>

    <!-- Code Syntax Tokens -->
    <rect x="165" y="68" width="45" height="8" rx="2" fill="#38BDF8"/>
    <rect x="216" y="68" width="80" height="8" rx="2" fill="#F1F5F9"/>
    <rect x="302" y="68" width="30" height="8" rx="2" fill="#2563EB"/>

    <rect x="180" y="96" width="60" height="8" rx="2" fill="#A855F7"/>
    <rect x="246" y="96" width="110" height="8" rx="2" fill="#38BDF8"/>

    <rect x="195" y="124" width="75" height="8" rx="2" fill="#34D399"/>
    <rect x="276" y="124" width="130" height="8" rx="2" fill="#94A3B8"/>

    <rect x="195" y="152" width="120" height="8" rx="2" fill="#F59E0B"/>
    <rect x="322" y="152" width="50" height="8" rx="2" fill="#2563EB"/>

    <rect x="195" y="180" width="90" height="8" rx="2" fill="#38BDF8"/>
    <rect x="292" y="180" width="140" height="8" rx="2" fill="#E2E8F0"/>

    <rect x="180" y="208" width="50" height="8" rx="2" fill="#A855F7"/>

    <rect x="165" y="236" width="70" height="8" rx="2" fill="#38BDF8"/>
    <rect x="242" y="236" width="120" height="8" rx="2" fill="#2563EB"/>

    <rect x="165" y="264" width="110" height="8" rx="2" fill="#34D399"/>
    <rect x="282" y="264" width="60" height="8" rx="2" fill="#F1F5F9"/>

    <!-- Cursor -->
    <rect x="348" y="262" width="2" height="12" fill="#2563EB"/>
  </g>

  <!-- Floating Architecture Element -->
  <g transform="translate(480, 360)">
    <rect width="220" height="130" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.06))"/>
    <rect x="16" y="16" width="40" height="40" rx="8" fill="#EFF6FF"/>
    <path d="M30 26L42 36L30 46" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="68" y="22" width="110" height="10" rx="3" fill="#0F172A"/>
    <rect x="68" y="38" width="70" height="8" rx="3" fill="#94A3B8"/>
    <line x1="16" y1="72" x2="204" y2="72" stroke="#F1F5F9" stroke-width="2"/>
    <rect x="16" y="86" width="85" height="22" rx="4" fill="#2563EB"/>
    <rect x="110" y="86" width="75" height="22" rx="4" fill="#F1F5F9"/>
  </g>

  <!-- Git Branching Graphic -->
  <g transform="translate(100, 410)">
    <rect width="180" height="70" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.04))"/>
    <circle cx="35" cy="35" r="8" fill="#2563EB"/>
    <line x1="43" y1="35" x2="90" y2="35" stroke="#2563EB" stroke-width="2"/>
    <circle cx="98" cy="35" r="8" fill="#2563EB"/>
    <line x1="106" y1="35" x2="145" y2="35" stroke="#94A3B8" stroke-width="2" stroke-dasharray="3 3"/>
    <circle cx="153" cy="35" r="6" fill="#94A3B8"/>
  </g>
</svg>
