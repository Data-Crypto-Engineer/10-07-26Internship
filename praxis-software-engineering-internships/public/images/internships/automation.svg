<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" fill="none">
  <!-- Background Canvas -->
  <rect width="800" height="600" rx="16" fill="#F8FAFC"/>
  <circle cx="150" cy="120" r="75" fill="#EFF6FF" opacity="0.8"/>
  <circle cx="690" cy="480" r="85" fill="#E2E8F0" opacity="0.6"/>

  <!-- Automation CI/CD Pipeline Board -->
  <g transform="translate(110, 110)">
    <!-- Base Panel -->
    <rect width="580" height="320" rx="12" fill="#0F172A" filter="drop-shadow(0 20px 25px rgba(15,23,42,0.15))"/>
    
    <!-- Header -->
    <rect width="580" height="42" rx="12" fill="#1E293B"/>
    <rect y="32" width="580" height="10" fill="#1E293B"/>
    <circle cx="24" cy="21" r="5" fill="#EF4444"/>
    <circle cx="42" cy="21" r="5" fill="#F59E0B"/>
    <circle cx="60" cy="21" r="5" fill="#10B981"/>
    <text x="90" y="25" fill="#94A3B8" font-family="monospace" font-size="11" font-weight="600">workflow_orchestrator.yml</text>

    <!-- Pipeline Stages Horizontal Flow -->
    <!-- Connecting Cable Lines -->
    <path d="M125 150 L195 150" stroke="#2563EB" stroke-width="3" stroke-dasharray="4 4"/>
    <path d="M285 150 L355 150" stroke="#2563EB" stroke-width="3"/>
    <path d="M445 150 L515 150" stroke="#2563EB" stroke-width="3"/>

    <!-- Stage 1: Trigger -->
    <g transform="translate(35, 95)">
      <rect width="90" height="110" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
      <circle cx="45" cy="35" r="16" fill="#EFF6FF"/>
      <polygon points="41,27 53,35 41,43" fill="#2563EB"/>
      <text x="22" y="68" fill="#F1F5F9" font-family="sans-serif" font-size="11" font-weight="600">Trigger</text>
      <rect x="18" y="78" width="54" height="12" rx="3" fill="#334155"/>
      <text x="24" y="87" fill="#94A3B8" font-family="monospace" font-size="9">webhook</text>
    </g>

    <!-- Stage 2: Build & Validate -->
    <g transform="translate(195, 95)">
      <rect width="90" height="110" rx="8" fill="#1E293B" stroke="#2563EB" stroke-width="2"/>
      <circle cx="45" cy="35" r="16" fill="#2563EB"/>
      <path d="M38 35L43 40L52 30" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="28" y="68" fill="#F1F5F9" font-family="sans-serif" font-size="11" font-weight="600">Build</text>
      <rect x="18" y="78" width="54" height="12" rx="3" fill="#1E40AF"/>
      <text x="26" y="87" fill="#93C5FD" font-family="monospace" font-size="9">docker</text>
    </g>

    <!-- Stage 3: Test Matrix -->
    <g transform="translate(355, 95)">
      <rect width="90" height="110" rx="8" fill="#1E293B" stroke="#2563EB" stroke-width="2"/>
      <circle cx="45" cy="35" r="16" fill="#2563EB"/>
      <path d="M38 35L43 40L52 30" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="20" y="68" fill="#F1F5F9" font-family="sans-serif" font-size="11" font-weight="600">Test Run</text>
      <rect x="18" y="78" width="54" height="12" rx="3" fill="#1E40AF"/>
      <text x="26" y="87" fill="#93C5FD" font-family="monospace" font-size="9">pytest</text>
    </g>

    <!-- Stage 4: Deploy -->
    <g transform="translate(515, 80)">
      <rect width="90" height="140" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
      <circle cx="45" cy="35" r="18" fill="#38BDF8"/>
      <!-- Rocket icon -->
      <path d="M45 23C41 29 40 37 45 42C50 37 49 29 45 23Z" fill="#0F172A"/>
      <text x="22" y="75" fill="#F1F5F9" font-family="sans-serif" font-size="11" font-weight="600">Deploy</text>
      <rect x="16" y="87" width="58" height="14" rx="3" fill="#0284C7"/>
      <text x="24" y="98" fill="#FFFFFF" font-family="monospace" font-size="9">cloud</text>
      <circle cx="45" cy="118" r="4" fill="#10B981"/>
    </g>

    <!-- Log Console Line -->
    <g transform="translate(35, 240)">
      <rect width="510" height="50" rx="6" fill="#111827"/>
      <text x="20" y="24" fill="#34D399" font-family="monospace" font-size="11">✓ Workflow triggered on push: main (commit 8f9b2d)</text>
      <text x="20" y="40" fill="#94A3B8" font-family="monospace" font-size="11">✓ Automated integration matrix executed in 41.2s</text>
    </g>
  </g>

  <!-- Side Badge Float -->
  <g transform="translate(480, 370)">
    <rect width="210" height="110" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.06))"/>
    <rect x="16" y="16" width="36" height="36" rx="8" fill="#EFF6FF"/>
    <path d="M26 34 L32 24 L38 34" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
    <rect x="64" y="20" width="100" height="10" rx="3" fill="#0F172A"/>
    <rect x="64" y="36" width="70" height="8" rx="3" fill="#94A3B8"/>
    <line x1="16" y1="64" x2="194" y2="64" stroke="#F1F5F9" stroke-width="1.5"/>
    <rect x="16" y="76" width="75" height="20" rx="4" fill="#2563EB"/>
    <rect x="100" y="76" width="65" height="20" rx="4" fill="#F1F5F9"/>
  </g>
</svg>
