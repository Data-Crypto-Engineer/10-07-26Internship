<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" fill="none">
  <!-- Background Canvas -->
  <rect width="800" height="600" rx="16" fill="#F8FAFC"/>
  <circle cx="140" cy="130" r="75" fill="#EFF6FF" opacity="0.8"/>
  <circle cx="680" cy="460" r="85" fill="#E2E8F0" opacity="0.6"/>

  <!-- Test Suite Terminal & Assertion Matrix -->
  <g transform="translate(120, 95)">
    <!-- Base Panel -->
    <rect width="560" height="340" rx="12" fill="#0F172A" filter="drop-shadow(0 20px 25px rgba(15,23,42,0.15))"/>
    
    <!-- Top Header -->
    <rect width="560" height="42" rx="12" fill="#1E293B"/>
    <rect y="32" width="560" height="10" fill="#1E293B"/>
    <circle cx="24" cy="21" r="5" fill="#EF4444"/>
    <circle cx="42" cy="21" r="5" fill="#F59E0B"/>
    <circle cx="60" cy="21" r="5" fill="#10B981"/>
    <text x="90" y="25" fill="#94A3B8" font-family="monospace" font-size="11" font-weight="600">vitest --coverage</text>

    <!-- Test Suite Rows -->
    <g transform="translate(30, 65)">
      <!-- Row 1: Passed Test -->
      <rect width="500" height="36" rx="6" fill="#1E293B"/>
      <circle cx="24" cy="18" r="8" fill="#10B981"/>
      <path d="M20 18L23 21L28 15" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="44" y="22" fill="#F1F5F9" font-family="monospace" font-size="11" font-weight="600">PASS</text>
      <text x="95" y="22" fill="#94A3B8" font-family="monospace" font-size="11">src/auth/session.spec.ts (4 passed)</text>
      <text x="440" y="22" fill="#64748B" font-family="monospace" font-size="11">14ms</text>

      <!-- Row 2: Passed Test -->
      <g transform="translate(0, 44)">
        <rect width="500" height="36" rx="6" fill="#1E293B"/>
        <circle cx="24" cy="18" r="8" fill="#10B981"/>
        <path d="M20 18L23 21L28 15" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="44" y="22" fill="#F1F5F9" font-family="monospace" font-size="11" font-weight="600">PASS</text>
        <text x="95" y="22" fill="#94A3B8" font-family="monospace" font-size="11">src/api/routes.contract.spec.ts (12 passed)</text>
        <text x="440" y="22" fill="#64748B" font-family="monospace" font-size="11">28ms</text>
      </g>

      <!-- Row 3: Passed Test -->
      <g transform="translate(0, 88)">
        <rect width="500" height="36" rx="6" fill="#1E293B"/>
        <circle cx="24" cy="18" r="8" fill="#10B981"/>
        <path d="M20 18L23 21L28 15" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="44" y="22" fill="#F1F5F9" font-family="monospace" font-size="11" font-weight="600">PASS</text>
        <text x="95" y="22" fill="#94A3B8" font-family="monospace" font-size="11">src/e2e/checkout-flow.spec.ts (6 passed)</text>
        <text x="435" y="22" fill="#64748B" font-family="monospace" font-size="11">112ms</text>
      </g>

      <!-- Row 4: Coverage Meter -->
      <g transform="translate(0, 136)">
        <rect width="500" height="70" rx="6" fill="#111827"/>
        <text x="16" y="24" fill="#64748B" font-family="monospace" font-size="11">Statements   : 98.4% ( 182 / 185 )</text>
        <text x="16" y="44" fill="#64748B" font-family="monospace" font-size="11">Branches     : 96.2% ( 51 / 53 )</text>
        <!-- Bar Indicator -->
        <rect x="280" y="20" width="190" height="8" rx="4" fill="#334155"/>
        <rect x="280" y="20" width="176" height="8" rx="4" fill="#2563EB"/>
        <rect x="280" y="40" width="190" height="8" rx="4" fill="#334155"/>
        <rect x="280" y="40" width="168" height="8" rx="4" fill="#10B981"/>
      </g>
    </g>
  </g>

  <!-- Floating Quality Gate Badge -->
  <g transform="translate(480, 365)">
    <rect width="215" height="120" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.06))"/>
    <rect x="16" y="16" width="36" height="36" rx="8" fill="#ECFDF5"/>
    <circle cx="34" cy="34" r="8" fill="#10B981"/>
    <path d="M30 34L33 37L38 31" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="64" y="20" width="110" height="10" rx="3" fill="#0F172A"/>
    <rect x="64" y="36" width="80" height="8" rx="3" fill="#94A3B8"/>
    <line x1="16" y1="66" x2="199" y2="66" stroke="#F1F5F9" stroke-width="1.5"/>
    <rect x="16" y="80" width="85" height="22" rx="4" fill="#2563EB"/>
    <rect x="110" y="80" width="60" height="22" rx="4" fill="#F8FAFC"/>
  </g>
</svg>
