<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" fill="none">
  <!-- Background Canvas -->
  <rect width="800" height="600" rx="16" fill="#F8FAFC"/>
  <circle cx="160" cy="140" r="70" fill="#EFF6FF" opacity="0.8"/>
  <circle cx="700" cy="460" r="90" fill="#E2E8F0" opacity="0.5"/>

  <!-- AI Model Pipeline / Neural Graph Frame -->
  <g transform="translate(130, 90)">
    <!-- Container -->
    <rect width="540" height="350" rx="12" fill="#0F172A" filter="drop-shadow(0 20px 25px rgba(15,23,42,0.15))"/>
    
    <!-- Top Header -->
    <rect width="540" height="42" rx="12" fill="#1E293B"/>
    <rect y="32" width="540" height="10" fill="#1E293B"/>
    <circle cx="24" cy="21" r="5" fill="#EF4444"/>
    <circle cx="42" cy="21" r="5" fill="#F59E0B"/>
    <circle cx="60" cy="21" r="5" fill="#10B981"/>
    <text x="90" y="25" fill="#94A3B8" font-family="monospace" font-size="11" font-weight="600">inference_pipeline.py</text>
    
    <!-- Neural Network Node Grid -->
    <g transform="translate(60, 70)">
      <!-- Connections -->
      <line x1="50" y1="50" x2="160" y2="30" stroke="#334155" stroke-width="2"/>
      <line x1="50" y1="50" x2="160" y2="100" stroke="#2563EB" stroke-width="2"/>
      <line x1="50" y1="50" x2="160" y2="170" stroke="#334155" stroke-width="2"/>

      <line x1="50" y1="120" x2="160" y2="30" stroke="#334155" stroke-width="2"/>
      <line x1="50" y1="120" x2="160" y2="100" stroke="#2563EB" stroke-width="2.5"/>
      <line x1="50" y1="120" x2="160" y2="170" stroke="#334155" stroke-width="2"/>

      <line x1="50" y1="190" x2="160" y2="100" stroke="#334155" stroke-width="2"/>
      <line x1="50" y1="190" x2="160" y2="170" stroke="#2563EB" stroke-width="2"/>

      <!-- Hidden Layer to Output Layer -->
      <line x1="160" y1="30" x2="280" y2="70" stroke="#334155" stroke-width="2"/>
      <line x1="160" y1="100" x2="280" y2="70" stroke="#2563EB" stroke-width="2.5"/>
      <line x1="160" y1="100" x2="280" y2="140" stroke="#2563EB" stroke-width="2.5"/>
      <line x1="160" y1="170" x2="280" y2="140" stroke="#334155" stroke-width="2"/>

      <line x1="280" y1="70" x2="380" y2="105" stroke="#2563EB" stroke-width="3"/>
      <line x1="280" y1="140" x2="380" y2="105" stroke="#2563EB" stroke-width="2"/>

      <!-- Input Layer Nodes -->
      <circle cx="50" cy="50" r="14" fill="#1E293B" stroke="#64748B" stroke-width="2"/>
      <circle cx="50" cy="120" r="14" fill="#1E293B" stroke="#2563EB" stroke-width="2"/>
      <circle cx="50" cy="190" r="14" fill="#1E293B" stroke="#64748B" stroke-width="2"/>

      <!-- Hidden Layer 1 Nodes -->
      <circle cx="160" cy="30" r="14" fill="#1E293B" stroke="#64748B" stroke-width="2"/>
      <circle cx="160" cy="100" r="16" fill="#2563EB" stroke="#60A5FA" stroke-width="2"/>
      <circle cx="160" cy="170" r="14" fill="#1E293B" stroke="#2563EB" stroke-width="2"/>

      <!-- Hidden Layer 2 Nodes -->
      <circle cx="280" cy="70" r="15" fill="#2563EB" stroke="#93C5FD" stroke-width="2"/>
      <circle cx="280" cy="140" r="14" fill="#1E293B" stroke="#64748B" stroke-width="2"/>

      <!-- Output Node -->
      <circle cx="380" cy="105" r="18" fill="#3B82F6" stroke="#FFFFFF" stroke-width="3"/>
    </g>

    <!-- Embedding Tensor / Latent Matrix Visual below -->
    <g transform="translate(60, 275)">
      <rect width="420" height="46" rx="6" fill="#111827"/>
      <text x="16" y="28" fill="#64748B" font-family="monospace" font-size="11">tokens: [emb_42, emb_89, attn_heads]</text>
      <rect x="260" y="16" width="60" height="16" rx="3" fill="#2563EB"/>
      <text x="270" y="28" fill="#FFFFFF" font-family="monospace" font-size="10">softmax</text>
      <rect x="330" y="16" width="75" height="16" rx="3" fill="#1E293B" stroke="#334155"/>
      <text x="340" y="28" fill="#38BDF8" font-family="monospace" font-size="10">0.9842</text>
    </g>
  </g>

  <!-- Metric / Evaluation Card -->
  <g transform="translate(470, 370)">
    <rect width="230" height="120" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.06))"/>
    <rect x="16" y="16" width="36" height="36" rx="8" fill="#EFF6FF"/>
    <circle cx="34" cy="34" r="8" stroke="#2563EB" stroke-width="2.5" fill="none"/>
    <circle cx="34" cy="34" r="3" fill="#2563EB"/>
    <rect x="64" y="20" width="110" height="10" rx="3" fill="#0F172A"/>
    <rect x="64" y="36" width="70" height="8" rx="3" fill="#94A3B8"/>
    <line x1="16" y1="66" x2="214" y2="66" stroke="#F1F5F9" stroke-width="1.5"/>
    <rect x="16" y="80" width="90" height="22" rx="4" fill="#2563EB"/>
    <rect x="116" y="80" width="70" height="22" rx="4" fill="#F8FAFC"/>
  </g>
</svg>
